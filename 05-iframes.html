<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elemento Iframe. Inline Frame para embutir outros sites.">
    <title> Sobre Iframes | HTML </title>
</head>

<body>
    <h1>Iframe</h1>
    <hr>

    <h2>Para que serve?</h2>
    <p> O Inline Frame é um elemento que nos permite embutir outro documento ou conteúdo externo dentro da nossa página.
        É bastante usado para YouTube, Google Maps, formulários externos e etc.</p>

    <h3>Exemplo básico de iframe</h3>
    <iframe src="04-imagens.html" frameborder="0"></iframe>

    <hr>
    <h3>Carregando o YouTube</h3>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/QdBZY2fkU-0?si=m5UHJ6qtrbLREqnd"
        title="YouTube video player COM O VÍDEO SOBRE GTA VI" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen
    >
    </iframe>

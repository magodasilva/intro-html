<!-- DOCTYPE - serve para indicar para os navegadores qual a versão e qual o padrão de HTML está sendo usado  -->
<!DOCTYPE html>

<!-- HTML - ELemento raiz. Tudo que pertecen ao documento HTML fica dentro dele -->

<!-- LANG/language(idioma) = Atributo responsavel pela linguagem do conteúdo do site. Além disso, tem um impacto muito grande na acessibilidade e SEO. -->
<html lang="pt-br">


    <head>

        <!-- charset = essa configuração serve para indicar ao navegador qual padrão/codificação de caracteres usar. Isso permite, utilizar palavras com acentos, caracteres especiais e emojis. -->
        <meta charset="UTF-8">

        <!--  -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- title/título = Representa o título que aparece na aba do navegador para o usuário. -->
        <title> Olá mundo </title>
    </head>

    <!-- body/corpo - conteúdo visivel da página onde o usuário interage e consome recursos da página. Por exemplo: Títulos, paragrafos, imagens, vídeos, formulários e etc. -->
    <body>
        Olá, Mundo. Este é o meu primeiro programa em HTML.
    </body>

</html>
